name: Metrics

on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # ─────────────────────────────────────────────────────────
      # Isometric commit calendar (Marble & Ledger Theme)
      # ─────────────────────────────────────────────────────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Jakarta
          extra_css: |
            :root {
              --color-calendar-graph-day-bg: #252430 !important;
              --color-calendar-graph-day-border: rgba(176, 141, 87, 0.25) !important;
              --color-calendar-graph-day-L1-bg: #4A3F2C !important;
              --color-calendar-graph-day-L2-bg: #7A633D !important;
              --color-calendar-graph-day-L3-bg: #B08D57 !important;
              --color-calendar-graph-day-L4-bg: #F5F1E8 !important;
            }
            svg {
              background-color: #15141A !important;
              color: #9A9080 !important;
              border: 1px solid rgba(176, 141, 87, 0.28) !important;
              border-radius: 2px !important;
            }
            h2, h3 {
              color: #B08D57 !important;
              font-family: 'Playfair Display', Georgia, serif !important;
            }
            .field svg {
              fill: #B08D57 !important;
            }
            .field {
              color: #9A9080 !important;
              font-family: 'DM Mono', monospace !important;
            }

      # ─────────────────────────────────────────────────────────
      # Music — recently listened tracks (Marble & Ledger Theme)
      # ─────────────────────────────────────────────────────────
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.music.svg
          template: classic
          base: ""
          plugin_music: yes
          plugin_music_provider: lastfm
          plugin_music_token: ${{ secrets.LASTFM_API_KEY }}
          plugin_music_user: ${{ secrets.LASTFM_USERNAME }}
          plugin_music_mode: recent
          plugin_music_limit: 4
          plugin_music_played_at: yes
          extra_css: |
            svg {
              background-color: #15141A !important;
              color: #9A9080 !important;
              border: 1px solid rgba(176, 141, 87, 0.28) !important;
              border-radius: 2px !important;
            }
            h2, h3 {
              color: #B08D57 !important;
              font-family: 'Playfair Display', Georgia, serif !important;
            }
            .name, .track {
              color: #F5F1E8 !important;
              font-family: 'DM Sans', sans-serif !important;
            }
            .artist {
              color: #B08D57 !important;
            }
            .field svg {
              fill: #B08D57 !important;
            }
            .time, .date {
              color: #6B6456 !important;
              font-family: 'DM Mono', monospace !important;
            }
